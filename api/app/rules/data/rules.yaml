# Справочник правил движка. Источник каждой law-нормы — Трудовой кодекс РФ,
# без сторонних источников (КоАП, подзаконные акты и т.д.). Ссылки указывают на
# базовый документ ТК РФ на КонсультантПлюс (cons_doc_LAW_34683); точная
# статья — в поле title, т.к. постатейные якоря страницы не проверялись и не
# зафиксированы во внешних источниках, доступных при составлении справочника.
#
# type: law — прямая норма ТК РФ; calculation — производный расчёт из нормы
# ТК РФ; company — внутреннее правило компании, не закон (norm.url — служебная
# внутренняя ссылка, не публичный ресурс).

- id: tk.115.balance
  type: law
  check: sufficient_balance
  severity: block
  norm:
    title: "ст. 115, 124 ТК РФ"
    url: "https://www.consultant.ru/document/cons_doc_LAW_34683/"
  effectiveFrom: "2002-02-01"
  checkedAt: "2026-09-20"
  messages:
    pass: "Остаток дней позволяет оформить отпуск: запрошено {requested} из {balance}"
    fail: "Недостаточно остатка дней отпуска: доступно {balance}, запрошено {requested}"

