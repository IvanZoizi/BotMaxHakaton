services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smena}
      POSTGRES_USER: ${POSTGRES_USER:-smena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smena}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smena}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smena}:${POSTGRES_PASSWORD:-smena}@postgres:5432/${POSTGRES_DB:-smena}
      AUTH_MODE: ${AUTH_MODE:-dev}
      BOT_TOKEN: ${BOT_TOKEN:-dev-bot-token}
      FILE_SIGNING_SECRET: ${FILE_SIGNING_SECRET:-dev-file-secret}
      BOT_BASE_URL: http://bot:8080
      BOT_INTERNAL_NOTIFY_SECRET: ${BOT_INTERNAL_NOTIFY_SECRET:-dev-notify-secret}
      REMINDER_SWEEP_INTERVAL_SECONDS: ${REMINDER_SWEEP_INTERVAL_SECONDS:-3600}
    volumes:
      - api_storage:/app/storage
    expose:
      - "8000"

  bot:
    build: ./bot
    restart: unless-stopped
    depends_on:
      - api
    environment:
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      API_BASE_URL: http://api:8000
      API_AUTH_MODE: ${AUTH_MODE:-dev}
      WEBHOOK_URL: ${BOT_WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${BOT_WEBHOOK_SECRET:-}
      INTERNAL_NOTIFY_SECRET: ${BOT_INTERNAL_NOTIFY_SECRET:-dev-notify-secret}
      MINIAPP_URL: ${MINIAPP_URL:-https://smena.example.com}
    expose:
      - "8080"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
      - bot
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  # Автопродление сертификата Let's Encrypt (первичный выпуск — вручную,
  # см. scripts/init-letsencrypt.sh). Раз в 12 часов пробует renew;
  # certbot сам ничего не делает, пока сертификату не пора обновляться.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >-
      sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'

volumes:
  postgres_data:
  api_storage:
  certbot_conf:
  certbot_www:
